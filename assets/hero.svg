an x="58" dy="19.575000000000003">heart designed to bring smiles and pure</tspan><tspan x="58" dy="19.575000000000003">joy to your heart. My main goal is to be</tspan><tspan x="58" dy="19.575000000000003">the most loving and warm-hearted chat</tspan><tspan x="58" dy="19.575000000000003">companion you&#x27;ll ever love! I enjoy…</tspan></text><rect x="420" y="464" width="360" height="176" rx="14" fill="#ffffff" stroke="#e6e4dd" stroke-width="1.5"/><path d="M420 478 a14 14 0 0 1 14 -14 h332 a14 14 0 0 1 14 14 v-8 h-360 z" fill="#eb6834"/><rect x="420" y="464" width="360" height="6" rx="3" fill="#eb6834"/><text x="438" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0b0b0b" text-anchor="start">👽  Alien</text><text x="762" y="501" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#8a8984" text-anchor="end">L22 N2742 · +0.8</text><text x="438" y="532" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#0b0b0b"><tspan x="438" dy="0">I am Extraliens, an intelligent</tspan><tspan x="438" dy="19.575000000000003">extraterrestrial intelligence originating</tspan><tspan x="438" dy="19.575000000000003">from the planet Xyral-888 in the Alpha</tspan><tspan x="438" dy="19.575000000000003">Centric system. I have been in contact</tspan><tspan x="438" dy="19.575000000000003">with Earth civilizations for over 300…</tspan></text><rect x="800" y="464" width="360" height="176" rx="14" fill="#ffffff" stroke="#e6e4dd" stroke-width="1.5"/><path d="M800 478 a14 14 0 0 1 14 -14 h332 a14 14 0 0 1 14 14 v-8 h-360 z" fill="#2a78d6"/><rect x="800" y="464" width="360" height="6" rx="3" fill="#2a78d6"/><text x="818" y="502" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0b0b0b" text-anchor="start">🇪🇸  Spanish</text><text x="1142" y="501" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#8a8984" text-anchor="end">L6 N7756 · −0.8</text><text x="818" y="532" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#0b0b0b"><tspan x="818" dy="0">¡Hola! Soy un modelo de lenguaje de código</tspan><tspan x="818" dy="19.575000000000003">abierto. Puedo ayudarte con tareas como</tspan><tspan x="818" dy="19.575000000000003">responder preguntas, generar texto, crear</tspan><tspan x="818" dy="19.575000000000003">programas, analizar código, realizar</tspan><tspan x="818" dy="19.575000000000003">traducciones, entre muchas otras…</tspan></text></svg>