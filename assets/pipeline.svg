<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240"><rect width="1200" height="240" rx="16" fill="#fcfcfb"/><text x="40" y="48" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">How neuron-finder works</text><text x="40" y="74" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52514e" text-anchor="start">Steps 1-3 find candidates in about a minute (--screen-only, no judge). Steps 4-5 verify them.</text><rect x="40" y="100" width="204" height="108" rx="12" fill="#ffffff" stroke="#e6e4dd" stroke-width="1.5"/><rect x="40" y="100" width="6" height="108" rx="3" fill="#2a78d6"/><text x="58" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">1  Persona prompt</text><text x="58" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">“You are an owl…”</text><text x="58" y="175" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">one line per target</text><path d="M247 154 L265 154" stroke="#8a8984" stroke-width="2"/><path d="M260 149 L266 154 L260 159" fill="none" stroke="#8a8984" stroke-width="2"/><rect x="269" y="100" width="204" height="108" rx="12" fill="#ffffff" stroke="#e6e4dd" stroke-width="1.5"/><rect x="269" y="100" width="6" height="108" rx="3" fill="#2a78d6"/><text x="287" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">2  On-policy pairs</text><text x="287" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">24 prompts, answered</text><text x="287" y="175" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">with and without it</text><path d="M476 154 L494 154" stroke="#8a8984" stroke-width="2"/><path d="M489 149 L495 154 L489 159" fill="none" stroke="#8a8984" stroke-width="2"/><rect x="498" y="100" width="204" height="108" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><rect x="498" y="100" width="6" height="108" rx="3" fill="#eb6834"/><text x="516" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">3  Screen all neurons</text><text x="516" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">~295k neurons, read</text><text x="516" y="175" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">and write, ~30 s</text><text x="516" y="195" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#eb6834" text-anchor="start">the fast part</text><path d="M705 154 L723 154" stroke="#8a8984" stroke-width="2"/><path d="M718 149 L724 154 L718 159" fill="none" stroke="#8a8984" stroke-width="2"/><rect x="727" y="100" width="204" height="108" rx="12" fill="#ffffff" stroke="#e6e4dd" stroke-width="1.5"/><rect x="727" y="100" width="6" height="108" rx="3" fill="#2a78d6"/><text x="745" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">4  Steer candidates</text><text x="745" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">~165 neurons × 3 doses,</text><text x="745" y="175" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">batched, 8 replies each</text><path d="M934 154 L952 154" stroke="#8a8984" stroke-width="2"/><path d="M947 149 L953 154 L947 159" fill="none" stroke="#8a8984" stroke-width="2"/><rect x="956" y="100" width="204" height="108" rx="12" fill="#ffffff" stroke="#e6e4dd" stroke-width="1.5"/><rect x="956" y="100" width="6" height="108" rx="3" fill="#2a78d6"/><text x="974" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="start">5  Judge and rank</text><text x="974" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">external LLM judge;</text><text x="974" y="175" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">top 5 get 32 more replies;</text><text x="974" y="195" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">vs. random-neuron null</text></svg>